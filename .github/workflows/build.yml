name: Amber APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Amber-source.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', channel: stable, cache: true}
      - run: |
          cd amber
          flutter pub get
          flutter build apk --release
      - id: ver
        run: |
          V=$(grep '^version:' amber/pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - run: cp amber/build/app/outputs/flutter-apk/app-release.apk "Amber-${{ steps.ver.outputs.v }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Amber ${{ steps.ver.outputs.v }}
          files: Amber-${{ steps.ver.outputs.v }}.apk
