name: Amber APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Amber-source.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', channel: stable, cache: true}
      - run: |
          cd amber
          flutter pub get
          flutter build apk --release
      - run: cp amber/build/app/outputs/flutter-apk/app-release.apk Amber-1.0.2.apk
      - uses: softprops/action-gh-release@v2
        with: {tag_name: v1.0.2, name: Amber 1.0.2, files: Amber-1.0.2.apk}
